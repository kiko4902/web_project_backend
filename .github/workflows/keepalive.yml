name: Keep database awake

# Supabase may pause free projects that see little activity for 7 days.
# /health/db runs a real query, which counts as activity.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity and emails a warning first; re-enable it from the Actions tab.

on:
  schedule:
    - cron: '17 6 * * 1,4' # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the API
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 30 \
            "$API_URL/health/db"
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
